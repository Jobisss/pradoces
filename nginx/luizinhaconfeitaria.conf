# Luizinha Confeitaria — host nginx reverse proxy (alternative to Caddyfile).
# Install at /etc/nginx/sites-available/luizinhaconfeitaria.com.br and symlink
# into sites-enabled. Runs on the HOST, in front of the PM2-managed Next.js
# process on 127.0.0.1:3000 (see ecosystem.config.js).
#
# NO ssl_certificate lines here on purpose: this is the plain HTTP (port 80)
# block. Run `certbot --nginx -d luizinhaconfeitaria.com.br -d www...` AFTER
# enabling this file — certbot edits this exact server block in place to add
# `listen 443 ssl`/cert paths, and (if you accept the redirect prompt) adds a
# separate port-80 block that 301s to https. Do NOT pre-fill cert paths here:
# `nginx -t` would fail before certbot ever runs, since the cert doesn't exist
# yet.
#
# Cloudflare terminates public TLS; this cert is only for Cloudflare's own
# "Full (Strict)" origin check (T-01-05-04) — same intent as the Caddy setup.
#
# CSP / X-Frame-Options / X-Content-Type-Options are set by the app itself
# (proxy.ts) — do NOT duplicate them here (Pitfall #10). Only HSTS lives here,
# and only matters once certbot has this block serving over 443.

server {
    listen 80;
    listen [::]:80;
    server_name luizinhaconfeitaria.com.br www.luizinhaconfeitaria.com.br;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Trust ONLY Cloudflare as a forwarding proxy (T-01-05-03), same intent as
    # Caddy's `trusted_proxies cloudflare`. This list is the Cloudflare IPv4/v6
    # ranges from https://www.cloudflare.com/ips-v4 (+ips-v6) — refresh
    # periodically, same source scripts/setup-ufw.sh already pulls from.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass CF-Connecting-IP through untouched — lib/net/client-ip.ts reads
        # it directly and it's already unspoofable (set by the Cloudflare edge).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

# Luizinha Confeitaria — host nginx reverse proxy.
# Install at /etc/nginx/sites-available/luizinha-confeitaria.com.br and symlink
# into sites-enabled. Runs on the HOST, in front of the Docker `app` container,
# which publishes only 127.0.0.1:3002 (see docker-compose.yml — 3000/3001 are
# already used by other apps sharing this VPS).
#
# NO Cloudflare in front — DNS points straight at this VPS (Hostinger DNS),
# so nginx is the ONLY hop between the internet and the app. lib/net/
# client-ip.ts prefers CF-Connecting-IP but falls back to the rightmost
# X-Forwarded-For hop, which is exactly what $proxy_add_x_forwarded_for below
# produces with a single proxy in front — no code changes needed.
#
# NO ssl_certificate lines here on purpose: this is the plain HTTP (port 80)
# block. Run `certbot --nginx -d luizinha-confeitaria.com.br -d www...` AFTER
# enabling this file — certbot edits this exact server block in place to add
# `listen 443 ssl`/cert paths, and (if you accept the redirect prompt) adds a
# separate port-80 block that 301s to https. Do NOT pre-fill cert paths here:
# `nginx -t` would fail before certbot ever runs, since the cert doesn't exist
# yet.
#
# CSP / X-Frame-Options / X-Content-Type-Options are set by the app itself
# (proxy.ts) — do NOT duplicate them here (Pitfall #10). Only HSTS lives here,
# and only matters once certbot has this block serving over 443.

server {
    listen 80;
    listen [::]:80;
    server_name luizinha-confeitaria.com.br www.luizinha-confeitaria.com.br;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

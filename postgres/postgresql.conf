# Luizinha Confeitaria — Postgres 16 production config (INFRA-10).
#
# Loaded via `postgres -c config_file=/etc/postgresql/postgresql.conf` (see
# docker-compose.yml). Because an explicit config_file replaces the image default
# entirely, this file MUST re-declare the connection essentials below — otherwise
# Postgres falls back to listen_addresses='localhost' and the app container can
# no longer reach the db over the compose network.

# --- Connections ---
listen_addresses = '*'        # reachable from the app container (compose network)
max_connections = 100

# --- Timezone (INFRA-10) — all timestamptz rendered in America/Sao_Paulo ---
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'

# --- Logging ---
log_destination = 'stderr'
logging_collector = off
